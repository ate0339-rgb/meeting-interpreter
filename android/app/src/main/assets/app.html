<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미팅 통역 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">

  <!-- LIVE -->
  <section class="view" id="v-live">
    <div class="top">
      <div class="title-wrap">
        <span class="brand">미팅 통역 노트</span>
        <input id="title" placeholder="미팅 제목을 입력하세요" autocomplete="off">
      </div>
      <span class="clock"><span class="dot"></span><span id="clock">00:00</span></span>
      <button class="icon" id="btn-settings-live" aria-label="설정" title="설정">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="pane en">
      <h2><span class="tag">EN</span><span class="label">들은 내용</span><span class="sub" id="lang-tag">en-US</span></h2>
      <div class="scroll" id="en-scroll">
        <div id="en-list"></div>
        <div class="interim" id="interim"></div>
      </div>
    </div>
    <div class="pane ko">
      <h2><span class="tag">KO</span><span class="label">한국어 번역</span><span class="sub">Google</span></h2>
      <div class="scroll" id="ko-scroll"><div id="ko-list"></div></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="bar">
      <button class="side" id="btn-history" aria-label="기록 보기">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>기록</button>
      <button class="recbtn" id="btn-rec" aria-label="녹음 시작"><i></i></button>
      <button class="side stop" id="btn-stop" aria-label="미팅 종료" disabled>
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>종료</button>
    </div>
  </section>

  <!-- HISTORY -->
  <section class="view" id="v-history" hidden>
    <div class="head">
      <button class="back" data-go="live">‹ 녹음</button>
      <h1>미팅 기록</h1>
      <button class="chip" id="btn-settings">설정</button>
    </div>
    <div class="list" id="history-list"></div>
  </section>

  <!-- DETAIL -->
  <section class="view" id="v-detail" hidden>
    <div class="head">
      <button class="back" data-go="history">‹ 기록</button>
      <h1 id="d-title"></h1>
    </div>
    <div class="list" id="detail"></div>
  </section>
</div>

<!-- settings sheet -->
<div class="scrim" id="s-settings" hidden>
  <div class="sheet" role="dialog" aria-label="설정">
    <h2>설정</h2>
    <label class="field">받는 메일 주소
      <input id="opt-email" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
      <small>"메일로 보내기"를 누르면 이 주소로 녹음 파일과 기록이 첨부된 메일 창이 열려요.</small>
    </label>
    <label class="field">인식할 영어 억양
      <select id="opt-lang">
        <option value="en-US">미국 영어 (en-US)</option>
        <option value="en-GB">영국 영어 (en-GB)</option>
        <option value="en-AU">호주 영어 (en-AU)</option>
        <option value="en-IN">인도 영어 (en-IN)</option>
        <option value="en-CA">캐나다 영어 (en-CA)</option>
      </select>
      <small>다음 녹음부터 적용돼요.</small>
    </label>
    <label class="field">글자 크기
      <select id="opt-fs">
        <option value="15">작게</option>
        <option value="17">보통</option>
        <option value="20">크게</option>
        <option value="23">아주 크게</option>
      </select>
    </label>
    <div class="group">
      <h3>AI로 분석하고 질문하기</h3>
      <ol class="howto">
        <li>미팅이 끝나면 <b>기록 → 미팅 → 메일로 보내기</b> (또는 Drive에 저장)</li>
        <li>Claude나 Codex에게 <b>"방금 보낸 미팅 분석해줘"</b>라고 말하기</li>
        <li>메일 본문의 영어·한국어 기록과 첨부된 녹음 파일로 요약하고 질문에 답해요</li>
      </ol>
    </div>
    <div class="row"><button class="chip primary" data-close>완료</button></div>
  </div>
</div>

<!-- word lookup sheet -->
<div class="scrim" id="s-word" hidden>
  <div class="sheet" role="dialog" aria-label="단어 풀이">
    <div class="lookup-word" id="w-word"></div>
    <div class="lookup-ctx" id="w-ctx"></div>
    <div class="lookup-mean" id="w-mean"></div>
    <div class="row">
      <button class="chip" data-close>닫기</button>
      <button class="chip primary" id="w-save">단어장에 저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const N = window.MeetingNative;
  const PREF = 'mn.prefs.v1';

  // ---------- helpers ----------
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const hhmm = t => new Date(t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const dur = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(x).padStart(2, '0') };
  const parse = s => { try { return JSON.parse(s) } catch { return null } };
  let toastTimer;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200) }
  const hint = t => $('#hint').textContent = t;

  let prefs = Object.assign({ lang: 'en-US', fs: '17' }, parse(localStorage.getItem(PREF)) || {});
  const savePrefs = () => { try { localStorage.setItem(PREF, JSON.stringify(prefs)) } catch {} };
  const applyPrefs = () => { document.documentElement.style.setProperty('--fs', prefs.fs + 'px'); $('#lang-tag').textContent = cur?.meta?.lang || prefs.lang };

  const titleOf = m => m.title || new Date(m.created).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + ' 미팅';
  const when = m => new Date(m.created).toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });

  // ---------- live state (the recorder service owns the truth) ----------
  let st = { recording: false };
  let cur = null;          // { meta, segs } of the meeting on screen
  let shownAt = 0, shownMs = 0, selId = null, pendingTitle = '';

  function loadSession(id) { cur = id ? parse(N.session(id)) : null; renderLive() }

  function setState(s) {
    const wasRecording = st.recording;
    st = s;
    shownMs = s.activeMs || 0; shownAt = Date.now();
    if (s.recording && s.session && s.session !== cur?.meta?.id) {
      loadSession(s.session);
      if (pendingTitle) { N.setTitle(s.session, pendingTitle); cur.meta.title = pendingTitle; pendingTitle = '' }
    }
    if (wasRecording && !s.recording && cur) loadSession(cur.meta.id);
    renderControls();
  }

  function renderControls() {
    const on = st.recording && !st.paused;
    document.body.classList.toggle('rec-on', on);
    $('#btn-rec').classList.toggle('paused', !!st.paused);
    $('#btn-rec').setAttribute('aria-label', on ? '일시정지' : st.paused ? '이어서 녹음' : '녹음 시작');
    $('#btn-stop').disabled = !st.recording;
    $('#clock').textContent = dur(curMs());
    if (st.recording) hint(st.note || (st.paused ? '일시정지됨 · 빨간 버튼을 누르면 이어서 녹음해요' : '녹음 중 · 화면을 꺼도, 다른 앱을 써도 계속 녹음해요'));
    $('#interim').textContent = st.recording ? (st.partial || '') : '';
  }
  // events can be missed while the page sleeps; ask the service directly before drawing
  function syncState() { const s = parse(N.state()); if (s && (s.recording !== st.recording || s.paused !== st.paused || s.session !== st.session)) setState(s) }
  const curMs = () => st.recording ? shownMs + (st.paused ? 0 : Date.now() - shownAt) : (cur?.meta?.activeMs || 0);
  setInterval(() => { if (st.recording && !st.paused) $('#clock').textContent = dur(curMs()) }, 1000);

  function renderLive() {
    $('#title').value = cur ? cur.meta.title || '' : pendingTitle;
    applyPrefs();
    $('#clock').textContent = dur(curMs());
    const en = $('#en-list'), ko = $('#ko-list');
    if (!cur || !cur.segs.length) {
      en.innerHTML = '<div class="empty">아래 <b>빨간 버튼</b>을 누르면 녹음과 영어 받아쓰기를 시작해요. 화면을 끄거나 다른 앱을 써도 계속 녹음돼요.<br>모르는 <b>단어를 탭</b>하면 뜻을 보고 단어장에 저장할 수 있어요.</div>';
      ko.innerHTML = '<div class="empty">문장마다 한국어 번역이 여기에 나와요. 미팅이 끝나면 <b>종료</b>를 누르고, 기록에서 메일이나 Drive로 보내 AI 분석을 받으세요.</div>';
      return;
    }
    en.innerHTML = cur.segs.map(enHTML).join('');
    ko.innerHTML = cur.segs.map(koHTML).join('');
    $('#en-scroll').scrollTop = 1e9; $('#ko-scroll').scrollTop = 1e9;
  }
  const words = t => esc(t).split(/(\s+)/).map(p => /\S/.test(p) ? '<span class="w">' + p + '</span>' : p).join('');
  const enHTML = s => `<span class="seg${s.id === selId ? ' sel' : ''}" data-id="${s.id}"><time>${hhmm(s.t)}</time>${words(s.en)}</span>`;
  const koHTML = s => `<span class="seg${s.id === selId ? ' sel' : ''}${s.ko ? '' : ' pending'}" data-id="${s.id}"><time>${hhmm(s.t)}</time>${s.ko ? esc(s.ko) : '번역 중…'}</span>`;
  const nearBottom = el => el.scrollHeight - el.scrollTop - el.clientHeight < 80;

  function appendSeg(s) {
    const es = $('#en-scroll'), ks = $('#ko-scroll'), sticky = [nearBottom(es), nearBottom(ks)];
    if (cur.segs.length === 1) { $('#en-list').innerHTML = ''; $('#ko-list').innerHTML = '' }
    $('#en-list').insertAdjacentHTML('beforeend', enHTML(s));
    $('#ko-list').insertAdjacentHTML('beforeend', koHTML(s));
    if (sticky[0]) es.scrollTop = es.scrollHeight;
    if (sticky[1]) ks.scrollTop = ks.scrollHeight;
  }

  // events from RecorderService
  window.__mn = e => {
    if (e.type === 'state') setState(e);
    else if (e.type === 'partial') { if (st.recording) { $('#interim').textContent = e.text; const es = $('#en-scroll'); if (nearBottom(es)) es.scrollTop = es.scrollHeight } }
    else if (e.type === 'seg') {
      $('#interim').textContent = '';
      if (cur && e.session === cur.meta.id) { cur.segs.push(e.seg); appendSeg(e.seg) }
    }
    else if (e.type === 'ko') {
      const s = cur?.segs.find(x => x.id === e.id); if (!s) return;
      s.ko = e.ko;
      const el = $('#ko-list').querySelector(`[data-id="${e.id}"]`);
      if (el) { const ks = $('#ko-scroll'), stick = nearBottom(ks); el.outerHTML = koHTML(s); if (stick) ks.scrollTop = ks.scrollHeight }
    }
    else if (e.type === 'error') { toast(e.text); hint(e.text) }
  };
  // coming back from the background: catch up on lines saved while the page was asleep
  window.__resume = () => {
    const s = parse(N.state()) || { recording: false };
    if (cur) loadSession(cur.meta.id);
    setState(s);
    if (!$('#v-history').hidden) renderHistory();
  };

  $('#btn-rec').onclick = () => {
    if (!st.recording) { N.start(cur && !cur.meta.ended ? cur.meta.id : '', prefs.lang); hint('녹음을 시작하는 중…') }
    else if (st.paused) N.resume();
    else N.pause();
  };
  $('#btn-stop').onclick = () => {
    if (!st.recording) return;
    N.stop();
    if (cur) cur.meta.ended = Date.now();
    hint('미팅을 저장했어요 · 기록에서 메일이나 Drive로 보낼 수 있어요');
  };
  $('#title').onchange = e => {
    const t = e.target.value.trim();
    if (cur && !cur.meta.ended) { N.setTitle(cur.meta.id, t); cur.meta.title = t } else pendingTitle = t;
  };

  // tap: select pair or look up a word
  function onPaneTap(e, other) {
    const seg = e.target.closest('.seg'); if (!seg || !cur) return;
    const s = cur.segs.find(x => x.id === seg.dataset.id); if (!s) return;
    const w = e.target.closest('.w');
    if (w) { lookup(w.textContent, s.en, cur.meta.id); return }
    selId = selId === s.id ? null : s.id;
    document.querySelectorAll('#v-live .seg').forEach(x => x.classList.toggle('sel', x.dataset.id === selId));
    $(other).querySelector(`[data-id="${s.id}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  $('#en-scroll').onclick = e => onPaneTap(e, '#ko-scroll');
  $('#ko-scroll').onclick = e => onPaneTap(e, '#en-scroll');

  // ---------- word lookup (Google translate, no AI) ----------
  let lookingUp = null;
  async function google(text) {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&dt=bd&q=' + encodeURIComponent(text));
    if (!r.ok) throw new Error('번역 서버 응답 ' + r.status);
    const j = await r.json();
    const main = (j[0] || []).map(x => x[0]).join('');
    const dict = (j[1] || []).map(d => `${d[0]}: ${(d[1] || []).slice(0, 4).join(', ')}`).join('\n');
    return dict ? main + '\n' + dict : main;
  }
  async function lookup(raw, sentence, sid) {
    const word = raw.replace(/^[^\w']+|[^\w']+$/g, ''); if (!word) return;
    const mine = lookingUp = { word, sentence, sid, meaning: '' };
    $('#w-word').textContent = word; $('#w-ctx').textContent = '“' + sentence + '”';
    $('#w-mean').textContent = '찾는 중…'; $('#w-save').disabled = true; $('#s-word').hidden = false;
    try {
      const m = await google(word);
      if (lookingUp !== mine) return;
      mine.meaning = m; $('#w-mean').textContent = m; $('#w-save').disabled = false;
    } catch (e) { $('#w-mean').textContent = '찾지 못했어요: ' + e.message }
  }
  $('#w-save').onclick = () => {
    if (!lookingUp) return;
    N.addWord(lookingUp.sid, JSON.stringify({ word: lookingUp.word, meaning: lookingUp.meaning, sentence: lookingUp.sentence }));
    $('#s-word').hidden = true; toast(`“${lookingUp.word}” 저장됨`);
  };

  // ---------- sheets ----------
  document.querySelectorAll('.scrim').forEach(s => s.addEventListener('click', e => {
    if (e.target === s || e.target.closest('[data-close]')) s.hidden = true;
  }));
  function openSettings() {
    $('#opt-lang').value = prefs.lang; $('#opt-fs').value = prefs.fs; $('#opt-email').value = N.pref('email');
    $('#s-settings').hidden = false;
  }
  $('#btn-settings').onclick = openSettings;
  $('#btn-settings-live').onclick = openSettings;
  ['#opt-lang', '#opt-fs'].forEach(id => $(id).addEventListener('change', () => {
    prefs = { lang: $('#opt-lang').value, fs: $('#opt-fs').value }; savePrefs(); applyPrefs();
  }));
  $('#opt-email').addEventListener('change', e => N.setPref('email', e.target.value.trim()));

  // ---------- views ----------
  function go(v) {
    syncState();
    ['live', 'history', 'detail'].forEach(x => $('#v-' + x).hidden = x !== v);
    if (v === 'history') renderHistory();
    if (v === 'live') renderLive();
  }
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $('#btn-history').onclick = () => go('history');
  window.__back = () => {
    if (!$('#s-word').hidden) { $('#s-word').hidden = true; return true }
    if (!$('#s-settings').hidden) { $('#s-settings').hidden = true; return true }
    if (!$('#v-detail').hidden) { go('history'); return true }
    if (!$('#v-history').hidden) { go('live'); return true }
    return false;
  };

  function renderHistory() {
    const L = $('#history-list');
    const list = (parse(N.sessions()) || []).filter(m => m.segCount || (m.audio && m.audio.length));
    if (!list.length) { L.innerHTML = '<div class="empty">아직 저장된 미팅이 없어요. 녹음을 시작하면 미팅마다 녹음 파일과 영어·한국어 기록이 따로 저장돼요.</div>'; return }
    L.innerHTML = list.map(m => `<button class="card" data-id="${esc(m.id)}">
      <strong>${esc(titleOf(m))}${st.recording && st.session === m.id ? ' · 녹음 중' : ''}</strong>
      <span class="meta">${when(m)} · ${dur(m.activeMs || 0)} · ${m.segCount || 0}문장${m.words?.length ? ' · 단어 ' + m.words.length : ''}</span>
      ${m.first ? `<p>${esc(m.first)}</p>` : ''}</button>`).join('');
    L.querySelectorAll('.card').forEach(c => c.onclick = () => showDetail(c.dataset.id));
  }

  let detailId = null, confirmDel = false, renaming = false;
  function showDetail(id) { detailId = id; confirmDel = false; renaming = false; go('detail'); renderDetail() }
  function renderDetail() {
    syncState();
    const d = parse(N.session(detailId)); if (!d) return go('history');
    const m = d.meta, live = st.recording && st.session === m.id;
    $('#d-title').innerHTML = renaming ? `<input class="title-edit" id="d-name" value="${esc(m.title)}" placeholder="${esc(titleOf(m))}">` : esc(titleOf(m));
    $('#detail').innerHTML = `
      <span class="meta">${when(m)} · ${dur(live ? curMs() : m.activeMs || 0)} · ${d.segs.length}문장 · 녹음 파일 ${(m.audio || []).length}개</span>
      ${live ? '<div class="empty" style="padding:0">지금 녹음 중인 미팅이에요. 종료한 뒤에 보낼 수 있어요.</div>' : ''}
      <div class="tools">
        <button class="chip primary" id="d-mail" ${live ? 'disabled' : ''}>메일로 보내기</button>
        <button class="chip" id="d-share" ${live ? 'disabled' : ''}>Drive·다른 앱으로</button>
        <button class="chip" id="d-resume">${live ? '녹음 화면으로' : '이어서 녹음'}</button>
        <button class="chip" id="d-rename">${renaming ? '이름 저장' : '이름 바꾸기'}</button>
        <button class="chip danger" id="d-del" ${live ? 'disabled' : ''}>${confirmDel ? '정말 삭제할까요? 한 번 더 누르기' : '삭제'}</button>
      </div>
      ${m.words?.length ? `<div class="sec"><h3>단어장 · ${m.words.length}</h3><dl class="words">${m.words.map(w => `<dt>${esc(w.word)}</dt><dd>${esc(w.meaning)}</dd>`).join('')}</dl></div>` : ''}
      <div class="sec"><h3>대화 기록</h3>
        ${d.segs.map(x => `<div class="pair"><div class="e"><span class="meta">${hhmm(x.t)}</span> ${esc(x.en)}</div><div class="k">${esc(x.ko || '(번역 없음)')}</div></div>`).join('') || '<div class="empty">받아쓴 문장이 없어요. 녹음 파일은 그대로 보낼 수 있어요.</div>'}
      </div>`;
    $('#d-mail').onclick = () => {
      if (!N.pref('email')) { toast('설정에서 받는 메일 주소를 넣으면 다음부터 바로 채워져요.') }
      N.share(m.id, 'mail');
    };
    $('#d-share').onclick = () => N.share(m.id, 'other');
    $('#d-resume').onclick = () => {
      if (!live) { if (st.recording) { toast('다른 미팅을 녹음 중이에요. 먼저 종료해 주세요.'); return } loadSession(m.id); cur.meta.ended = 0; N.start(m.id, m.lang || prefs.lang) }
      go('live');
    };
    $('#d-rename').onclick = () => {
      if (renaming) { const v = $('#d-name').value.trim(); N.setTitle(m.id, v); if (cur?.meta.id === m.id) cur.meta.title = v; renaming = false }
      else renaming = true;
      renderDetail();
      if (renaming) $('#d-name').focus();
    };
    $('#d-del').onclick = () => {
      if (!confirmDel) { confirmDel = true; renderDetail(); return }
      if (!N.remove(m.id)) { toast('녹음 중인 미팅은 지울 수 없어요.'); return }
      if (cur?.meta.id === m.id) cur = null;
      go('history'); toast('삭제했어요');
    };
  }

  // ---------- boot ----------
  const s0 = parse(N.state()) || { recording: false };
  if (s0.recording) loadSession(s0.session); else renderLive();
  setState(s0);
})();
</script>
</body>
</html>
