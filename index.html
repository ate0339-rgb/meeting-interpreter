<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미팅 통역">
<title>미팅 통역 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one-screen phone app — English source on top, Korean below, controls pinned to the bottom edge */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#17212B; --muted:#6B7783; --line:#DDE2E7;
  --rec:#D4472E; --ko:#1E6A86; --hl:#FFF1C9; --hl-ink:#5A4300; --ok:#2F7D4F;
  --f-en:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ko:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs:17px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171D; --surface:#19212A; --ink:#E6EBF0; --muted:#8A96A2; --line:#2A3540;
    --rec:#F0664B; --ko:#6CC0DD; --hl:#3A3220; --hl-ink:#F5DE9C; --ok:#6CCB8F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171D; --surface:#19212A; --ink:#E6EBF0; --muted:#8A96A2; --line:#2A3540;
  --rec:#F0664B; --ko:#6CC0DD; --hl:#3A3220; --hl-ink:#F5DE9C; --ok:#6CCB8F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ko);font-size:15px;
  -webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ko);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:8px;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.top input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);
  font:600 16px var(--f-ko);padding:4px 0}
.top input::placeholder{color:var(--muted);font-weight:500}
.clock{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.rec-on .dot{background:var(--rec);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.rec-on .dot{animation:none}}
.icon{width:36px;height:36px;display:grid;place-items:center;border-radius:10px}
.icon svg,.side svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* panes */
.pane{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);
  margin:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));
  border:1px solid var(--line)}
.pane.en{border-radius:14px 14px 4px 4px}
.pane.ko{border-radius:4px 4px 14px 14px;margin-top:6px}
.pane h2{margin:0;padding:9px 14px 6px;font:500 11px var(--f-mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.pane.ko h2{color:var(--ko)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 14px 14px;overscroll-behavior:contain}
.seg{display:block;padding:6px 8px;margin:0 -8px;border-radius:8px;line-height:1.5}
.seg.sel{background:var(--hl);color:var(--hl-ink)}
.en .seg{font-family:var(--f-en);font-size:var(--fs)}
.ko .seg{font-family:var(--f-ko);font-size:calc(var(--fs) * .97)}
.seg time{font:400 10.5px var(--f-mono);color:var(--muted);margin-right:6px;vertical-align:1px}
.seg.sel time{color:inherit;opacity:.7}
.w{border-radius:3px;cursor:pointer}
.w:hover{background:var(--line)}
.interim{font-family:var(--f-en);font-size:var(--fs);color:var(--muted);font-style:italic;line-height:1.5;padding:6px 0}
.pending{color:var(--muted)}
.err{color:var(--rec);font-size:13px}
.empty{color:var(--muted);font-size:14px;line-height:1.6;padding:10px 0;max-width:34em}
.empty b{color:var(--ink);font-weight:600}

/* bottom bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.side{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);min-width:64px;padding:4px}
.recbtn{width:68px;height:68px;border-radius:50%;border:3px solid var(--rec);display:grid;place-items:center;background:var(--surface)}
.recbtn i{display:block;width:26px;height:26px;border-radius:50%;background:var(--rec);transition:border-radius .2s,width .2s,height .2s}
.rec-on .recbtn i{width:22px;height:22px;border-radius:5px}
.hint{text-align:center;font-size:11.5px;color:var(--muted);padding:0 16px;min-height:16px}

/* history + detail */
.head{display:flex;align-items:center;gap:8px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.head h1{flex:1;margin:0;font:600 18px var(--f-ko);text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.back{display:flex;align-items:center;gap:2px;color:var(--ko);font-weight:500;padding:4px 4px 4px 0}
.list{flex:1;overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.card{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card strong{font-weight:600;font-size:15px}
.meta{font:400 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.card p{margin:2px 0 0;font-family:var(--f-en);color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px}
.chip.primary{background:var(--ko);border-color:var(--ko);color:var(--surface)}
.chip.danger{color:var(--rec)}
.chip:disabled{opacity:.5}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sec h3{margin:0 0 8px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pair{padding:8px 0;border-top:1px solid var(--line)}
.pair:first-of-type{border-top:0}
.pair .e{font-family:var(--f-en);font-size:16px;line-height:1.5}
.pair .k{color:var(--ko);line-height:1.55;margin-top:2px}
.summary{white-space:pre-wrap;line-height:1.65;font-size:14.5px;overflow-wrap:anywhere}
.words{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.words dt{font-family:var(--f-en);font-weight:600}
.words dd{margin:0;color:var(--muted);min-width:0}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.sheet h2{margin:0;font:600 17px var(--f-ko)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field select,.field input,.paste{font:15px var(--f-ko);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field small{line-height:1.5}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.group{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.group h3{margin:0;font:600 14px var(--f-ko);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group h3 small{font:400 12px var(--f-ko);color:var(--muted)}
.steps{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--muted)}
.steps b{color:var(--ink);font-weight:600}
.status{font-size:13px;display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.lookup-word{font:600 24px var(--f-en)}
.lookup-ctx{font-family:var(--f-en);color:var(--muted);font-size:14px;line-height:1.5}
.lookup-mean{font-size:16px;line-height:1.6;white-space:pre-wrap}

/* ask */
.sheet.ask{height:88%;gap:10px}
.ask-head{display:flex;align-items:center;gap:8px}
.ask-head h2{flex:1}
.thread{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;line-height:1.6;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.q{align-self:flex-end;background:var(--ko);color:var(--surface);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.msg.a.err{color:var(--rec)}
.ask-row{display:flex;gap:8px;align-items:flex-end}
.ask-row textarea{flex:1;min-width:0;resize:none;font:15px var(--f-ko);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.quick{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.quick .chip{white-space:nowrap;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- LIVE -->
  <section class="view" id="v-live">
    <div class="top">
      <input id="title" placeholder="미팅 제목" autocomplete="off">
      <span class="clock"><span class="dot"></span><span id="clock">00:00</span></span>
      <button class="icon" id="btn-new" aria-label="새 미팅" title="새 미팅">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon" id="btn-settings-live" aria-label="설정" title="설정">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="pane en">
      <h2><span>English · 들은 내용</span><span id="lang-tag">en-US</span></h2>
      <div class="scroll" id="en-scroll">
        <div id="en-list"></div>
        <div class="interim" id="interim"></div>
      </div>
    </div>
    <div class="pane ko">
      <h2><span>한국어 번역</span><span id="engine-tag">Google</span></h2>
      <div class="scroll" id="ko-scroll"><div id="ko-list"></div></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="bar">
      <button class="side" id="btn-history" aria-label="기록 보기">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>기록</button>
      <button class="recbtn" id="btn-rec" aria-label="녹음 시작"><i></i></button>
      <button class="side" id="btn-ask" aria-label="질문하기">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.8 9.5a2.3 2.3 0 0 1 4.4.9c0 1.5-2.2 2-2.2 3.1M12 16.5h.01"/></svg>질문</button>
    </div>
  </section>

  <!-- HISTORY -->
  <section class="view" id="v-history" hidden>
    <div class="head">
      <button class="back" data-go="live">‹ 녹음</button>
      <h1>미팅 기록</h1>
      <button class="chip" id="btn-settings">설정</button>
    </div>
    <div class="list" id="history-list"></div>
  </section>

  <!-- DETAIL -->
  <section class="view" id="v-detail" hidden>
    <div class="head">
      <button class="back" data-go="history">‹ 기록</button>
      <h1 id="d-title"></h1>
    </div>
    <div class="list" id="detail"></div>
  </section>
</div>

<!-- settings sheet -->
<div class="scrim" id="s-settings" hidden>
  <div class="sheet" role="dialog" aria-label="설정">
    <h2>설정</h2>
    <div class="group">
      <h3>ChatGPT 연결 <small>구독으로 질문·분석·번역</small></h3>
      <div id="gpt-box"></div>
    </div>
    <label class="field">질문·분석에 쓸 AI
      <select id="opt-ai">
        <option value="gpt">ChatGPT (구독)</option>
        <option value="claude">Claude (API 키)</option>
      </select>
    </label>
    <label class="field">실시간 번역
      <select id="opt-engine">
        <option value="google">Google 번역 (무료, 가장 빠름)</option>
        <option value="gpt">ChatGPT (문맥 반영, 구독 사용량 차감)</option>
        <option value="claude">Claude (문맥 반영, API 키 필요)</option>
      </select>
    </label>
    <label class="field">Claude API 키 (선택)
      <input id="opt-key" type="password" placeholder="sk-ant-..." autocomplete="off">
      <small>이 폰의 브라우저에만 저장됩니다. ChatGPT 대신 Claude를 쓰고 싶을 때만 넣으세요.</small>
    </label>
    <label class="field">인식할 영어 억양
      <select id="opt-lang">
        <option value="en-US">미국 영어 (en-US)</option>
        <option value="en-GB">영국 영어 (en-GB)</option>
        <option value="en-AU">호주 영어 (en-AU)</option>
        <option value="en-IN">인도 영어 (en-IN)</option>
        <option value="en-CA">캐나다 영어 (en-CA)</option>
      </select>
    </label>
    <label class="field">글자 크기
      <select id="opt-fs">
        <option value="15">작게</option>
        <option value="17">보통</option>
        <option value="20">크게</option>
        <option value="23">아주 크게</option>
      </select>
    </label>
    <div class="row"><button class="chip primary" data-close>완료</button></div>
  </div>
</div>

<!-- word lookup sheet -->
<div class="scrim" id="s-word" hidden>
  <div class="sheet" role="dialog" aria-label="단어 풀이">
    <div class="lookup-word" id="w-word"></div>
    <div class="lookup-ctx" id="w-ctx"></div>
    <div class="lookup-mean" id="w-mean"></div>
    <div class="row">
      <button class="chip" data-close>닫기</button>
      <button class="chip primary" id="w-save">단어장에 저장</button>
    </div>
  </div>
</div>

<!-- ask sheet -->
<div class="scrim" id="s-ask" hidden>
  <div class="sheet ask" role="dialog" aria-label="질문하기">
    <div class="ask-head">
      <h2>질문하기</h2>
      <span class="meta" id="ask-who"></span>
      <button class="chip" data-close>닫기</button>
    </div>
    <div class="thread" id="thread"></div>
    <div class="tools quick" id="quick">
      <button class="chip" data-q="최근 1~2분 동안 나온 말을 한국어로 쉽게 풀어서 설명해 줘. 핵심만.">방금 뭐라고 했어?</button>
      <button class="chip" data-q="최근 5분 내용을 한국어로 3~5줄로 요약해 줘.">최근 5분 요약</button>
      <button class="chip" data-q="가장 최근에 참석자(특히 나)에게 던져진 질문이나 요청이 있으면 무엇인지 한국어로 설명하고, 내가 바로 말할 수 있는 짧은 영어 답변 예시 2개를 한국어 뜻과 함께 줘.">나한테 물어본 거야?</button>
      <button class="chip" data-q="지금까지 나온 전문 용어와 어려운 영어 표현을 '영어 — 한국어 뜻(짧은 설명)' 형식으로 정리해 줘.">용어 정리</button>
      <button class="chip" data-fill="영어로: ">내 말을 영어로</button>
    </div>
    <form class="ask-row" id="ask-form">
      <textarea id="ask-input" rows="2" placeholder="궁금한 점을 한국어로 물어보세요"></textarea>
      <button class="chip primary" id="ask-send" type="submit">보내기</button>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const STORE = 'mi.sessions.v1', PREF = 'mi.prefs.v1', PENDING = 'mi.oauth.pending';
  const HAIKU = 'claude-haiku-5-5', SONNET = 'claude-sonnet-5-5';
  // Sign in with ChatGPT — open-source client flow (developers.openai.com/siwc)
  const AUTH = 'https://auth.openai.com/api/accounts/authorize';
  const TOKEN = 'https://auth.openai.com/api/accounts/oauth/token';
  const OIDC = 'https://auth.openai.com/.well-known/openid-configuration';
  const RES = 'https://api.openai.com/v1';
  const REDIR = 'http://127.0.0.1:1455/auth/callback';
  const SCOPE = 'openid profile email offline_access resource.invoke chatgpt.tokens.use.direct';
  const AGENT = 'Meeting Interpreter Notes';

  // ---------- storage ----------
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true } catch { return false } };
  let sessions = load(STORE, []);
  let prefs = Object.assign({ lang: 'en-US', engine: 'google', ai: 'gpt', key: '', fs: '17' }, load(PREF, {}));
  const savePrefs = () => save(PREF, prefs);
  let saveTimer;
  const persist = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => {
    if (!save(STORE, sessions)) toast('저장 공간이 부족해요. 오래된 기록을 내보낸 뒤 삭제해 주세요.');
  }, 400) };

  // ---------- helpers ----------

    try {
      const m = provider()
        ? plain(await ai({ instructions: 'You explain English words to a Korean professional during a meeting. Given a word and the sentence it was heard in, reply in Korean in at most 2 short lines, plain text: line 1 = the meaning in this context (Korean equivalent), line 2 = a brief usage note or common collocation if useful. No preamble.',
            user: `Word: ${word}\nSentence: ${sentence}`, fast: true }))
        : await google(word).catch(() => mymemory(word));
      if (lookingUp !== mine) return;
      mine.meaning = m; $('#w-mean').textContent = m; $('#w-save').disabled = false;
    } catch (e) { $('#w-mean').textContent = '찾지 못했어요: ' + e.message }
  }
  $('#w-save').onclick = () => {
    if (!lookingUp) return;
    if (!cur) newSession();
    if (!cur.words.some(w => w.word.toLowerCase() === lookingUp.word.toLowerCase())) {
      cur.words.push({ word: lookingUp.word, meaning: lookingUp.meaning, sentence: lookingUp.sentence }); persist();
    }
    close('#s-word'); toast(`“${lookingUp.word}” 저장됨`);
  };

  // ---------- ask ----------
  const SYS_ASK = 'You are the private assistant of a Korean graduate researcher/professional who is attending an English meeting right now (or reviewing one). You see the speech-recognition transcript (it may contain misheard words). Answer in Korean, short and easy to read on a phone, plain text with "- " bullets when useful, no markdown headers or bold. Ground answers in the transcript and cite timestamps like (14:02) when pointing to a moment. If something was not said, say so. For general questions (terms, background) you may use your own knowledge, marked as 일반 지식. When asked to say something in English, give 2 natural spoken options suited to the meeting tone, each with a Korean gloss.';
  let askS = null;
  function transcript(s, limit = 60000) {
    let t = s.segs.map(x => `[${hhmm(x.t)}] ${x.en}`).join('\n');
    return t.length > limit ? '(앞부분 생략)\n' + t.slice(-limit) : t;
  }
  function openAsk(s) {
    askS = s; renderThread(); open('#s-ask');
  }
  function renderThread() {
    const T = $('#thread'), chat = askS?.chat || [], p = provider();
    $('#ask-who').textContent = p ? (p === 'gpt' ? 'ChatGPT' : 'Claude') : '연결 안 됨';
    if (!p) {
      T.innerHTML = '<div class="empty">질문하려면 AI 연결이 필요해요. <b>설정 → ChatGPT로 계속하기</b>로 로그인하세요 (앱을 새로 열 때마다 10초 정도 걸리는 재연결이 필요해요).</div><div><button class="chip primary" id="ask-setup">설정 열기</button></div>';
      $('#ask-setup').onclick = () => { close('#s-ask'); openSettings() };
      return;
    }
    T.innerHTML = chat.length
      ? chat.map(m => `<div class="msg q">${esc(m.q)}</div><div class="msg a${m.err ? ' err' : ''}">${esc(m.a || '생각 중…')}</div>`).join('')
      : `<div class="empty">${askS && askS.segs.length ? '지금까지 들은 ' + askS.segs.length + '문장을 바탕으로 답해요.' : '아직 들은 내용이 없어요. 녹음을 시작하면 그 내용을 바탕으로 답해요.'} 아래 버튼을 누르거나 직접 물어보세요.</div>`;
    T.scrollTop = T.scrollHeight;
  }
  async function ask(q) {
    q = q.trim(); if (!q) return;
    if (!provider()) { renderThread(); return }
    if (!askS) { if (!cur) newSession(); askS = cur }
    (askS.chat ||= []);
    const prev = askS.chat.filter(m => !m.err).slice(-6).map(m => `Q: ${m.q}\nA: ${m.a}`).join('\n\n');
    const m = { q, a: '', t: Date.now() }; askS.chat.push(m); renderThread();
    const user = `Meeting: ${titleOf(askS)}\nCurrent time: ${hhmm(Date.now())}\n\nTranscript so far:\n${transcript(askS) || '(nothing recorded yet)'}\n\n${prev ? 'Earlier Q&A in this meeting:\n' + prev + '\n\n' : ''}Question: ${q}`;
    const bubble = () => [...$('#thread').querySelectorAll('.msg.a')].pop();
    try {
      m.a = plain(await ai({ instructions: SYS_ASK, user, onText: t => { const b = bubble(); if (b) { b.textContent = plain(t); const T = $('#thread'); T.scrollTop = T.scrollHeight } } }));
    } catch (e) { m.a = e.message; m.err = true }
    renderThread(); persist();
  }
  $('#ask-form').onsubmit = e => { e.preventDefault(); const v = $('#ask-input').value; $('#ask-input').value = ''; ask(v) };
  $('#ask-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#ask-form').requestSubmit() } });
  $('#quick').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (b.dataset.fill) { const i = $('#ask-input'); i.value = b.dataset.fill; i.focus(); return }
    ask(b.dataset.q);
  };
  $('#btn-ask').onclick = () => openAsk(cur);

  // ---------- sheets ----------
  function open(id) { $(id).hidden = false }
  function close(id) { $(id).hidden = true }
  document.querySelectorAll('.scrim').forEach(s => s.addEventListener('click', e => {
    if (e.target === s || e.target.closest('[data-close]')) s.hidden = true;
  }));

  async function renderGptBox() {
    const B = $('#gpt-box');
    if (gpt) {
      const opts = sel => (gpt.models || []).map(m => `<option value="${esc(m.slug)}"${m.slug === sel ? ' selected' : ''}>${esc(m.name)}</option>`).join('');
      B.innerHTML = `<div class="status"><i></i>연결됨 · ${esc(gpt.email || 'ChatGPT')}</div>
        ${gpt.models.length ? `<label class="field">질문·분석 모델<select id="opt-model">${opts(prefs.gptModel)}</select></label>
        <label class="field">번역·단어 풀이 모델 (빠른 모델 추천)<select id="opt-fast">${opts(prefs.gptFast)}</select></label>` : '<div class="note">모델 목록을 불러오지 못했어요.</div>'}
        <div class="row" style="justify-content:flex-start"><button class="chip danger" id="gpt-out">로그아웃</button></div>`;
      $('#gpt-out').onclick = gptSignOut;
      $('#opt-model') && ($('#opt-model').onchange = e => { prefs.gptModel = e.target.value; savePrefs() });
      $('#opt-fast') && ($('#opt-fast').onchange = e => { prefs.gptFast = e.target.value; savePrefs() });
      return;
    }
    B.innerHTML = `<ol class="steps">
        <li><b>ChatGPT로 계속하기</b>를 눌러 로그인하고 허용하세요.</li>
        <li>마지막에 <b>“사이트에 연결할 수 없음”</b> 화면이 나오면 정상이에요. 그 화면 <b>주소창의 주소 전체</b>를 복사하세요.</li>
        <li>이 앱으로 돌아와 아래 칸에 붙여넣고 <b>연결</b>을 누르세요.</li>
      </ol>
      <div class="row" style="justify-content:flex-start"><a class="chip primary" id="gpt-login" target="_blank" rel="noopener" href="#">ChatGPT로 계속하기</a></div>
      <input class="paste" id="gpt-paste" placeholder="http://127.0.0.1:1455/auth/callback?code=…" autocomplete="off" inputmode="url">
      <div class="row" style="justify-content:flex-start"><button class="chip" id="gpt-done">연결</button></div>
      <div class="note">${prefs.gptClientId ? '이전에 등록한 계정이라 두 번째부터는 계정 선택만 하면 돼요. ' : ''}보안을 위해 로그인 토큰은 저장하지 않아요. 앱을 새로 열면 다시 연결해 주세요.</div>`;
    const a = $('#gpt-login');
    a.setAttribute('aria-disabled', 'true');
    a.href = await gptAuthUrl(); a.removeAttribute('aria-disabled');
    $('#gpt-done').onclick = async () => {
      const b = $('#gpt-done'); b.disabled = true; b.textContent = '연결 중…';
      try { await gptFinish($('#gpt-paste').value); toast('ChatGPT 연결 완료'); renderGptBox(); renderTags() }
      catch (e) { toast(e.message); b.disabled = false; b.textContent = '연결'; if (!load(PENDING, null)) $('#gpt-login').href = await gptAuthUrl() }
    };
  }
  function openSettings() {
    $('#opt-lang').value = prefs.lang; $('#opt-engine').value = prefs.engine; $('#opt-key').value = prefs.key;
    $('#opt-fs').value = prefs.fs; $('#opt-ai').value = prefs.ai;
    renderGptBox(); open('#s-settings');
  }
  $('#btn-settings').onclick = openSettings;
  $('#btn-settings-live').onclick = openSettings;
  ['#opt-lang', '#opt-engine', '#opt-key', '#opt-fs', '#opt-ai'].forEach(id => $(id).addEventListener('change', () => {
    const langChanged = prefs.lang !== $('#opt-lang').value;
    Object.assign(prefs, { lang: $('#opt-lang').value, engine: $('#opt-engine').value, key: $('#opt-key').value.trim(), fs: $('#opt-fs').value, ai: $('#opt-ai').value });
    savePrefs(); applyPrefs(langChanged);
    if (prefs.engine === 'gpt' && !gpt) toast('ChatGPT 번역은 위에서 로그인해야 켜져요. 그 전엔 Google 번역을 써요.');
    if (prefs.engine === 'claude' && !prefs.key) toast('Claude 번역을 쓰려면 API 키를 입력해 주세요.');
  }));
  function applyPrefs(restart) {
    document.documentElement.style.setProperty('--fs', prefs.fs + 'px');
    renderTags();
    if (restart && running) { try { rec.onend = null; rec.stop() } catch {} rec = makeRec(); try { rec.start() } catch {} }
  }

  // ---------- views ----------
  function go(v) {
    ['live', 'history', 'detail'].forEach(x => $('#v-' + x).hidden = x !== v);
    if (v === 'history') renderHistory();
    if (v === 'live') renderLive();
  }
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $('#btn-history').onclick = () => go('history');

  const titleOf = s => s.title || new Date(s.created).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + ' 미팅';
  const when = s => new Date(s.created).toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });

  function renderHistory() {
    const L = $('#history-list');
    const list = sessions.filter(s => s.segs.length || s.chat?.length || s === cur);
    if (!list.length) { L.innerHTML = '<div class="empty">아직 저장된 미팅이 없어요. 녹음을 시작하면 미팅마다 따로 기록되고, 여기서 원문·번역·단어장·질문·AI 분석을 다시 볼 수 있어요.</div>'; return }
    L.innerHTML = list.map(s => `<button class="card" data-id="${s.id}">
      <strong>${esc(titleOf(s))}${s === cur && running ? ' · 녹음 중' : ''}</strong>
      <span class="meta">${when(s)} · ${dur(s === cur ? curMs() : s.activeMs)} · ${s.segs.length}문장${s.words.length ? ' · 단어 ' + s.words.length : ''}${s.chat?.length ? ' · 질문 ' + s.chat.length : ''}${s.summary ? ' · 분석됨' : ''}</span>
      ${s.segs[0] ? `<p>${esc(s.segs[0].en)}</p>` : ''}</button>`).join('');
    L.querySelectorAll('.card').forEach(c => c.onclick = () => showDetail(c.dataset.id));
  }

  let detailId = null, confirmDel = false;
  function showDetail(id) {
    detailId = id; confirmDel = false; go('detail'); renderDetail();
  }
  function renderDetail() {
    const s = sessions.find(x => x.id === detailId); if (!s) return go('history');
    $('#d-title').textContent = titleOf(s);
    const chat = (s.chat || []).filter(m => !m.err);
    $('#detail').innerHTML = `
      <span class="meta">${when(s)} · ${dur(s === cur ? curMs() : s.activeMs)} · ${s.segs.length}문장 · ${s.lang || 'en-US'}</span>
      <div class="tools">
        <button class="chip primary" id="d-ask">이 미팅에 질문하기</button>
        <button class="chip" id="d-resume">이어서 녹음</button>
        <button class="chip" id="d-md">Markdown 저장</button>
        <button class="chip" id="d-copy">전체 복사</button>
        <button class="chip" id="d-json">JSON 저장</button>
        <button class="chip danger" id="d-del">${confirmDel ? '정말 삭제할까요? 한 번 더 누르기' : '삭제'}</button>
      </div>
      <div class="sec"><h3>AI 분석</h3>
        ${s.summary ? `<div class="summary">${esc(s.summary)}</div>` : `<div class="empty" style="padding:0 0 8px">요약, 결정사항, 해야 할 일, 다시 확인할 부분, 핵심 용어를 한국어로 정리해요. ChatGPT 로그인이나 Claude 키가 필요해요.</div>`}
        <div class="tools" style="margin-top:8px"><button class="chip" id="d-ai" ${s.segs.length ? '' : 'disabled'}>${s.summary ? '다시 분석' : '분석하기'}</button></div>
      </div>
      ${chat.length ? `<div class="sec"><h3>질문 기록 · ${chat.length}</h3>${chat.map(m => `<div class="pair"><div class="e" style="font-family:var(--f-ko);font-size:14.5px;font-weight:600">Q. ${esc(m.q)}</div><div class="summary" style="margin-top:4px">${esc(m.a)}</div></div>`).join('')}</div>` : ''}
      ${s.words.length ? `<div class="sec"><h3>단어장 · ${s.words.length}</h3><dl class="words">${s.words.map(w => `<dt>${esc(w.word)}</dt><dd>${esc(w.meaning)}</dd>`).join('')}</dl></div>` : ''}
      <div class="sec"><h3>대화 기록</h3>
        ${s.segs.map(x => `<div class="pair"><div class="e"><span class="meta">${hhmm(x.t)}</span> ${esc(x.en)}</div><div class="k">${esc(x.ko || '(번역 없음)')}</div></div>`).join('') || '<div class="empty">기록된 문장이 없어요.</div>'}
      </div>`;
    $('#d-ask').onclick = () => openAsk(s);
    $('#d-resume').onclick = () => { if (cur !== s) { stop(); cur = s } go('live'); setTimeout(() => { $('#en-scroll').scrollTop = 1e9; $('#ko-scroll').scrollTop = 1e9 }, 0) };
    $('#d-md').onclick = () => fileOut(s, 'md');
    $('#d-json').onclick = () => fileOut(s, 'json');
    $('#d-copy').onclick = async () => { try { await navigator.clipboard.writeText(toMd(s)); toast('복사했어요') } catch { toast('복사할 수 없어요. Markdown 저장을 써 주세요.') } };
    $('#d-del').onclick = () => {
      if (!confirmDel) { confirmDel = true; renderDetail(); return }
      if (s === cur) { stop(); cur = null }
      sessions = sessions.filter(x => x !== s); persist(); go('history'); toast('삭제했어요');
    };
    $('#d-ai').onclick = () => analyze(s);
  }

  function toMd(s) {
    let o = `# ${titleOf(s)}\n\n- 일시: ${when(s)}\n- 녹음 시간: ${dur(s.activeMs)}\n- 문장 수: ${s.segs.length}\n\n`;
    if (s.summary) o += `## AI 분석\n\n${s.summary}\n\n`;
    const chat = (s.chat || []).filter(m => !m.err);
    if (chat.length) o += `## 질문 기록\n\n${chat.map(m => `**Q. ${m.q}**\n\n${m.a}`).join('\n\n')}\n\n`;
    if (s.words.length) o += `## 단어장\n\n${s.words.map(w => `- **${w.word}** — ${w.meaning.replace(/\n/g, ' ')}`).join('\n')}\n\n`;
    o += `## 대화 기록\n\n` + s.segs.map(x => `**[${hhmm(x.t)}]** ${x.en}\n> ${x.ko || ''}`).join('\n\n') + '\n';
    return o;
  }
  async function fileOut(s, ext) {
    const name = (titleOf(s).replace(/[\\/:*?"<>|]/g, '').trim() || 'meeting') + '_' + new Date(s.created).toISOString().slice(0, 10) + '.' + ext;
    const body = ext === 'md' ? toMd(s) : JSON.stringify(s, null, 2);
    const file = new File([body], name, { type: ext === 'md' ? 'text/markdown' : 'application/json' });
    if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return } catch (e) { if (e.name === 'AbortError') return } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }

  async function analyze(s) {
    if (!provider()) { toast('설정에서 ChatGPT로 로그인하거나 Claude 키를 넣어 주세요.'); return }
    const b = $('#d-ai'); b.disabled = true; b.textContent = '분석 중…';
    try {
      s.summary = plain(await ai({
        instructions: 'You analyze an English meeting transcript (from speech recognition, may contain misheard words) for a Korean graduate researcher/professional who attended. Write in Korean, plain text with simple section headers on their own line and "- " bullets, no markdown bold or tables. Sections, in order: 한 줄 요약 / 주요 내용 / 결정된 사항 / 해야 할 일 (누가·무엇을·언제, if stated) / 다시 확인할 부분 (unclear or likely misheard parts, with timestamps) / 핵심 용어 (English term — Korean meaning, 5-12 items). Be specific and faithful; do not invent facts.',
        user: `Meeting title: ${titleOf(s)}\n\nTranscript:\n${transcript(s, 150000)}`,
        onText: t => { if (detailId === s.id) { const el = $('#detail .summary'); if (el) el.textContent = plain(t) } }
      }));
      persist();
    } catch (e) { toast(e.message) }
    if (detailId === s.id) renderDetail();
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  applyPrefs(false); renderLive();
  // reopen the most recent unfinished session (e.g., after the browser reloaded mid-meeting)
  const latest = sessions[0];
  if (latest && Date.now() - latest.created < 3 * 3600e3 && latest.segs.length) { cur = latest; renderLive(); hint('이전 미팅을 불러왔어요 · 버튼을 누르면 이어서 기록해요') }
})();
</script>
</body>
</html>
